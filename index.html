```html
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Tracker</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #09090b;
  --card: rgba(255,255,255,.055);
  --border: rgba(255,255,255,.09);
  --text: #f5f5f5;
  --muted: #8b8b95;
  --accent: #8b5cf6;
  --accent2: #6366f1;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 0%, rgba(139,92,246,.18), transparent 32%),
    radial-gradient(circle at 90% 20%, rgba(99,102,241,.12), transparent 28%),
    var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
  width: min(100%, 480px);
  min-height: 100vh;
  margin: auto;
  padding: 28px 18px 110px;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
  animation: fadeDown .6s ease;
}

.header h1 {
  font-size: 28px;
  letter-spacing: -.8px;
}

.header p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 5px;
}

.settings {
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 14px;
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: .25s;
}

.settings:hover {
  transform: rotate(20deg);
  background: rgba(255,255,255,.09);
}

/* Main counter */
.counter {
  position: relative;
  overflow: hidden;
  padding: 28px;
  border-radius: 28px;
  background:
    linear-gradient(145deg,
      rgba(139,92,246,.22),
      rgba(255,255,255,.045));
  border: 1px solid var(--border);
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
  animation: fadeUp .7s ease;
}

.counter::before {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  right: -70px;
  top: -70px;
  background: rgba(139,92,246,.22);
  filter: blur(45px);
  border-radius: 50%;
}

.counter-label {
  color: #b7b2c5;
  font-size: 14px;
}

.number {
  font-size: 72px;
  line-height: 1;
  font-weight: 750;
  letter-spacing: -4px;
  margin: 12px 0;
}

.counter-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.status {
  color: #bdb8ca;
  font-size: 13px;
}

.add {
  border: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  font-size: 15px;
  font-weight: 700;
  padding: 13px 19px;
  border-radius: 15px;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(99,102,241,.3);
  transition: transform .15s, box-shadow .2s;
}

.add:active {
  transform: scale(.92);
}

/* Stats */
.section-title {
  margin: 28px 0 13px;
  font-size: 16px;
  font-weight: 650;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stat {
  padding: 19px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  animation: fadeUp .8s ease;
}

.stat span {
  color: var(--muted);
  font-size: 12px;
}

.stat strong {
  display: block;
  margin-top: 7px;
  font-size: 25px;
}

/* Chart */
.chart {
  height: 190px;
  padding: 18px 15px;
  border-radius: 22px;
  background: var(--card);
  border: 1px solid var(--border);
  display: flex;
  align-items: end;
  gap: 9px;
}

.bar-wrap {
  flex: 1;
  height: 100%;
  display: flex;
  align-items: end;
  justify-content: center;
}

.bar {
  width: 100%;
  max-width: 28px;
  height: var(--height);
  border-radius: 8px 8px 5px 5px;
  background: linear-gradient(to top, var(--accent2), var(--accent));
  transform-origin: bottom;
  animation: grow .8s cubic-bezier(.2,.8,.2,1);
}

.day {
  position: absolute;
  margin-top: 205px;
  font-size: 10px;
  color: var(--muted);
}

.chart-wrap {
  position: relative;
  padding-bottom: 25px;
}

/* History */
.history {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 17px;
  border-radius: 17px;
  background: var(--card);
  border: 1px solid var(--border);
  transition: .2s;
}

.history-item:hover {
  transform: translateX(3px);
  background: rgba(255,255,255,.075);
}

.history-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px rgba(139,92,246,.7);
}

.history-time {
  color: var(--muted);
  font-size: 12px;
}

/* Bottom navigation */
.nav {
  position: fixed;
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);
  width: min(calc(100% - 32px), 450px);
  display: flex;
  justify-content: space-around;
  padding: 10px;
  background: rgba(18,18,21,.82);
  backdrop-filter: blur(18px);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

.nav button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 9px 15px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 20px;
  transition: .2s;
}

.nav button.active {
  color: white;
  background: rgba(139,92,246,.16);
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 95px;
  transform: translate(-50%, 20px);
  padding: 12px 18px;
  border-radius: 14px;
  background: #18181b;
  border: 1px solid var(--border);
  opacity: 0;
  pointer-events: none;
  transition: .3s;
  font-size: 13px;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* Animations */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeDown {
  from {
    opacity: 0;
    transform: translateY(-15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes grow {
  from {
    transform: scaleY(0);
  }
  to {
    transform: scaleY(1);
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div>
      <h1>Mijn tracker</h1>
      <p>Dagelijks overzicht</p>
    </div>
    <button class="settings">⚙</button>
  </header>

  <section class="counter">
    <div class="counter-label">Vandaag</div>

    <div class="number" id="count">0</div>

    <div class="counter-footer">
      <div class="status">Activiteiten geregistreerd</div>
      <button class="add" onclick="addItem()">+ Toevoegen</button>
    </div>
  </section>

  <div class="section-title">Overzicht</div>

  <section class="stats">
    <div class="stat">
      <span>Deze week</span>
      <strong id="weekCount">0</strong>
    </div>

    <div class="stat">
      <span>Gemiddeld</span>
      <strong id="average">0</strong>
    </div>
  </section>

  <div class="section-title">Deze week</div>

  <div class="chart-wrap">
    <div class="chart" id="chart"></div>
  </div>

  <div class="section-title">Recente activiteit</div>

  <div class="history" id="history"></div>

</div>

<nav class="nav">
  <button class="active">⌂</button>
  <button>▦</button>
  <button>◉</button>
  <button>⚙</button>
</nav>

<div class="toast" id="toast">
  Toegevoegd ✓
</div>

<script>
let count = Number(localStorage.getItem("trackerCount")) || 0;

let history = JSON.parse(
  localStorage.getItem("trackerHistory") || "[]"
);

let week = JSON.parse(
  localStorage.getItem("trackerWeek") ||
  "[0,0,0,0,0,0,0]"
);

const countEl = document.getElementById("count");
const weekEl = document.getElementById("weekCount");
const averageEl = document.getElementById("average");
const historyEl = document.getElementById("history");
const chartEl = document.getElementById("chart");
const toast = document.getElementById("toast");

function render() {
  countEl.textContent = count;

  const total = week.reduce((a,b) => a + b, 0);
  weekEl.textContent = total;

  const avg = Math.round(total / 7 * 10) / 10;
  averageEl.textContent = avg;

  renderChart();
  renderHistory();
}

function addItem() {
  count++;

  const now = new Date();

  history.unshift({
    time: now.toLocaleTimeString("nl-NL", {
      hour: "2-digit",
      minute: "2-digit"
    })
  });

  if (history.length > 6) {
    history.pop();
  }

  const day = (now.getDay() + 6) % 7;
  week[day]++;

  localStorage.setItem("trackerCount", count);
  localStorage.setItem("trackerHistory", JSON.stringify(history));
  localStorage.setItem("trackerWeek", JSON.stringify(week));

  render();

  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 1300);
}

function renderHistory() {
  if (!history.length) {
    historyEl.innerHTML = `
      <div class="history-item">
        <span style="color:#888">
          Nog geen activiteit geregistreerd
        </span>
      </div>
    `;
    return;
  }

  historyEl.innerHTML = history.map(item => `
    <div class="history-item">
      <div class="history-left">
        <div class="dot"></div>
        <span>Activiteit</span>
      </div>
      <span class="history-time">${item.time}</span>
    </div>
  `).join("");
}

function renderChart() {
  const days = ["Ma","Di","Wo","Do","Vr","Za","Zo"];

  chartEl.innerHTML = week.map((value, index) => {

    const max = Math.max(...week, 1);
    const height = Math.max((value / max) * 85, 5);

    return `
      <div class="bar-wrap">
        <div
          class="bar"
          style="--height:${height}%"
          title="${value}"
        ></div>
        <span class="day">${days[index]}</span>
      </div>
    `;
  }).join("");
}

render();
</script>

</body>
</html>
